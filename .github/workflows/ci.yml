# CI pipeline — activated now that src/backend, src/ai and src/frontend contain code.
# Runs the full automated suite against a real PostgreSQL service, then typechecks
# and builds both applications.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_policy_assistant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_policy_assistant_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_policy_assistant_test?schema=public
      JWT_SECRET: ci-test-secret-not-used-in-any-deployment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database schema
        run: npm run db:push

      - name: Generate seed policy PDFs
        run: npm run seed:pdfs

      - name: Run automated tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
